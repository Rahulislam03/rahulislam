<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone Lookup - Nexus</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0f172a] text-white flex items-center justify-center min-h-screen p-4">
    <div class="bg-[#1e293b] p-8 rounded-2xl shadow-2xl w-full max-w-md border border-blue-500/30">
        <a href="/" class="text-blue-400 text-sm mb-4 inline-block">← হোম পেজে ফিরুন</a>
        <h1 class="text-2xl font-bold mb-6 text-center">Phone Lookup</h1>
        <input id="num" type="text" placeholder="+88017XXXXXXXX" class="w-full p-4 rounded-xl bg-[#0f172a] border border-gray-700 mb-4 focus:ring-2 focus:ring-blue-500 outline-none text-center">
        <button onclick="lookup()" class="w-full bg-blue-600 hover:bg-blue-700 py-3 rounded-xl font-bold transition-all">সার্চ করুন</button>
        <div id="result" class="mt-8 p-4 bg-[#0f172a] rounded-xl hidden border border-gray-800 space-y-2">
            <p id="res-loc"></p><p id="res-car"></p><p id="res-val"></p>
        </div>
    </div>
    <script>
        async function lookup() {
            const num = document.getElementById('num').value;
            const resDiv = document.getElementById('result');
            const response = await fetch('/api/', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ number: num })
            });
            const result = await response.json();
            if(result.status === "success") {
                resDiv.classList.remove('hidden');
                document.getElementById('res-loc').innerText = "📍 লোকেশন: " + result.data.location;
                document.getElementById('res-car').innerText = "📶 অপারেটর: " + result.data.carrier;
                document.getElementById('res-val').innerText = "✅ স্ট্যাটাস: " + result.data.valid;
            } else { alert(result.message); }
        }
    </script>
</body>
</html>
