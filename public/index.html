<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSLCommerz Secure Node</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 flex items-center justify-center min-h-screen p-6">
    <div class="max-w-md w-full bg-white rounded-[2.5rem] p-10 shadow-2xl text-center border-b-8 border-orange-500">
        <h1 class="text-3xl font-black text-blue-900 italic mb-1">SSL<span class="text-orange-600">Commerz</span></h1>
        <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-10">Live Verification Gateway</p>
        
        <div class="space-y-6">
            <input id="phone" type="text" placeholder="01XXXXXXXXX" 
                class="w-full bg-gray-50 border-2 border-gray-100 p-5 rounded-2xl text-2xl font-mono font-bold focus:border-orange-500 outline-none text-center transition-all">
            
            <button onclick="startVerification()" id="mainBtn" 
                class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-5 rounded-2xl shadow-lg transform active:scale-95 transition-all uppercase tracking-wider">
                Verify Now
            </button>
        </div>

        <div id="status" class="hidden mt-8 text-center">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-t-2 border-b-2 border-orange-500 mb-4"></div>
            <p class="text-xs font-bold text-gray-500 uppercase animate-pulse">Requesting Secure Session...</p>
        </div>
    </div>

    <script>
        async function startVerification() {
            const num = document.getElementById('phone').value;
            if(!num) return alert("Please enter a number");

            document.getElementById('mainBtn').disabled = true;
            document.getElementById('mainBtn').classList.add('opacity-50');
            document.getElementById('status').classList.remove('hidden');

            try {
                // ক্যাশ এড়াতে টাইমস্ট্যাম্প যোগ করা হয়েছে
                const response = await fetch('/api?cache_bust=' + Date.now(), {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ number: num })
                });
                
                const data = await response.json();
                
                if(data.status === 'success') {
                    // কোনো কার্ড দেখাবে না, সরাসরি গেটওয়েতে পাঠিয়ে দিবে
                    window.location.href = data.url;
                } else {
                    alert("Gateway busy: " + (data.message || "Try again"));
                    location.reload();
                }
            } catch (err) {
                alert("Connection failed.");
                location.reload();
            }
        }
    </script>
</body>
</html>
