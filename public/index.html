<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Tools - Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-[#0f172a] text-white min-h-screen">

    <header class="py-16 text-center">
        <h1 class="text-5xl font-extrabold text-blue-500 mb-4">NEXUS TOOLKIT</h1>
        <p class="text-gray-400">আপনার প্রয়োজনীয় টুলটি নিচে থেকে বেছে নিন</p>
    </header>

    <!-- এই ডিভ-এর ভেতরে অটোমেটিক কার্ড তৈরি হবে -->
    <main id="tools-container" class="max-w-6xl mx-auto px-6 grid grid-cols-1 md:grid-cols-3 gap-6 pb-20">
        <!-- জাভাস্ক্রিপ্ট এখানে কার্ডগুলো ইনসার্ট করবে -->
    </main>

    <script>
        // tools.json ফাইল থেকে ডাটা লোড করার ফাংশন
        async function loadTools() {
            const response = await fetch('./tools.json');
            const tools = await response.json();
            const container = document.getElementById('tools-container');

            container.innerHTML = tools.map(tool => `
                <div class="bg-[#1e293b] p-8 rounded-2xl border border-gray-800 hover:border-${tool.color}-500 transition-all group">
                    <div class="text-${tool.color}-500 text-3xl mb-4 group-hover:scale-110 transition-transform">
                        <i class="${tool.icon}"></i>
                    </div>
                    <h3 class="text-xl font-bold mb-2">${tool.name}</h3>
                    <p class="text-gray-400 text-sm mb-6">${tool.description}</p>
                    <a href="${tool.link}" class="inline-block bg-blue-600 hover:bg-blue-700 px-6 py-2 rounded-lg font-semibold transition">ব্যবহার করুন</a>
                </div>
            `).join('');
        }

        loadTools();
    </script>
</body>
</html>
