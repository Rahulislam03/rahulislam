<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Intelligence - Full Auto Lookup</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); }
        .loading-bar { height: 3px; width: 0%; background: #3b82f6; transition: width 0.5s; }
    </style>
</head>
<body class="bg-[#0f172a] text-white min-h-screen p-4 flex flex-col items-center">

    <div class="w-full max-w-lg mt-10">
        <div class="text-center mb-10">
            <h1 class="text-4xl font-black text-blue-500 mb-2">NEXUS AI</h1>
            <p class="text-gray-400 text-[10px] uppercase tracking-[0.3em]">Advanced Phone OSINT Engine</p>
        </div>

        <div class="glass p-6 rounded-[2.5rem] mb-8 shadow-2xl">
            <div id="loader" class="loading-bar mb-4 rounded-full"></div>
            <input id="num" type="text" placeholder="+8801XXXXXXXXX" class="w-full bg-[#0f172a] border border-gray-800 p-5 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none text-center text-2xl font-mono transition-all">
            <button onclick="autoSearch()" id="btn" class="w-full bg-blue-600 hover:bg-blue-700 mt-4 p-5 rounded-2xl font-bold transition-all flex items-center justify-center space-x-3">
                <i class="fas fa-bolt"></i>
                <span id="btn-text">DEEP SEARCH</span>
            </button>
        </div>

        <div id="result" class="hidden space-y-4 animate-fade-in pb-10">
            
            <div class="glass p-8 rounded-[2.5rem] text-center">
                <span class="bg-blue-500/10 text-blue-400 text-[10px] font-bold px-3 py-1 rounded-full uppercase">Identity Registry</span>
                <h2 id="res-owner" class="text-3xl font-black mt-3"></h2>
                <p id="res-loc" class="text-gray-400 text-sm mt-1"></p>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="glass p-5 rounded-3xl">
                    <p class="text-[10px] text-gray-500 uppercase font-bold mb-1">Operator</p>
                    <p id="res-car" class="font-bold text-blue-400"></p>
                </div>
                <div class="glass p-5 rounded-3xl">
                    <p class="text-[10px] text-gray-500 uppercase font-bold mb-1">Status</p>
                    <p id="res-val" class="font-bold text-green-500"></p>
                </div>
            </div>

            <div class="glass p-6 rounded-[2rem] space-y-3">
                <div class="flex justify-between text-sm">
                    <span class="text-gray-500">Format</span>
                    <span id="res-fmt" class="font-mono"></span>
                </div>
                <div class="flex justify-between text-sm">
                    <span class="text-gray-500">Timezone</span>
                    <span id="res-tz" class="text-yellow-500"></span>
                </div>
                <div class="flex justify-between text-sm">
                    <span class="text-gray-500">Line Type</span>
                    <span id="res-type" class="text-purple-400 font-bold"></span>
                </div>
            </div>

            <div class="glass p-4 rounded-3xl border border-yellow-500/20">
                <a id="res-whos" target="_blank" class="flex items-center justify-between px-4 py-2">
                    <span class="text-sm font-bold text-yellow-500 uppercase">Whoscall Deep Verify</span>
                    <i class="fas fa-chevron-right text-gray-600"></i>
                </a>
            </div>
        </div>
    </div>

    <script>
        async function autoSearch() {
            const num = document.getElementById('num').value;
            const btnText = document.getElementById('btn-text');
            const loader = document.getElementById('loader');
            const resDiv = document.getElementById('result');

            if(!num) return alert("Number Enter Korun!");

            // UI Reset
            resDiv.classList.add('hidden');
            loader.style.width = "40%";
            btnText.innerText = "Accessing Databases...";

            try {
                const response = await fetch('/api/', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ number: num })
                });
                const res = await response.json();

                if(res.status === "success") {
                    loader.style.width = "100%";
                    resDiv.classList.remove('hidden');
                    
                    // ম্যাপিং
                    document.getElementById('res-owner').innerText = res.data.owner;
                    document.getElementById('res-loc').innerText = res.data.location;
                    document.getElementById('res-car').innerText = res.data.carrier;
                    document.getElementById('res-val').innerText = res.data.valid;
                    document.getElementById('res-fmt').innerText = res.data.intl;
                    document.getElementById('res-tz').innerText = res.data.timezone;
                    document.getElementById('res-type').innerText = res.data.type;
                    document.getElementById('res-whos').href = res.data.whoscall_link;

                    setTimeout(() => { loader.style.width = "0%"; }, 1000);
                } else {
                    alert(res.message);
                }
            } catch (err) {
                alert("Server Error! GitHub-e requirements.txt check korun.");
            } finally {
                btnText.innerText = "DEEP SEARCH";
            }
        }
    </script>
</body>
    </html>
