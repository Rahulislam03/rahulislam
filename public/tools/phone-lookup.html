<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SSLCommerz - Real Identity Node</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #f8fafc; font-family: 'Inter', sans-serif; }
        .ssl-card { background: white; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); border-top: 5px solid #ff6a00; }
        .btn-verify { background: linear-gradient(135deg, #ff6a00 0%, #ee5a00 100%); transition: 0.3s; }
        .terminal-text { font-family: 'Courier New', monospace; font-size: 11px; }
    </style>
</head>
<body class="p-6 flex flex-col items-center justify-center min-h-screen">

    <div class="max-w-md w-full">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-black italic text-blue-800">SSL<span class="text-orange-500">Commerz</span></h1>
            <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mt-2">Real-Time Merchant Identity Gateway</p>
        </div>

        <div class="ssl-card p-8 mb-6">
            <label class="text-[11px] font-bold text-gray-400 uppercase mb-3 block">Input Target MSISDN</label>
            <input id="num" type="text" placeholder="01XXXXXXXXX" class="w-full bg-gray-50 border-2 border-gray-100 p-4 rounded-xl text-xl font-bold focus:border-orange-500 outline-none transition-all mb-4">
            
            <button onclick="accessRealGateway()" id="btn" class="w-full btn-verify py-4 rounded-xl font-bold text-white uppercase text-xs tracking-widest shadow-lg shadow-orange-500/30">
                Execute Real Search
            </button>
        </div>

        <div id="status" class="hidden bg-gray-900 p-4 rounded-xl terminal-text text-green-400 space-y-1 shadow-2xl">
            <p id="l1">> Initializing Secure SSL Handshake...</p>
            <p id="l2" class="hidden">> Requesting MFS Metadata from Bank Node...</p>
            <p id="l3" class="hidden">> Redirecting to Live Gateway for Real Name...</p>
        </div>
    </div>

    <script>
        async function accessRealGateway() {
            const num = document.getElementById('num').value;
            const btn = document.getElementById('btn');
            const statusBox = document.getElementById('status');

            if(!num) return;

            btn.innerText = "CONNECTING...";
            statusBox.classList.remove('hidden');

            // Fake steps for professional look
            setTimeout(() => document.getElementById('l2').classList.remove('hidden'), 500);
            setTimeout(() => document.getElementById('l3').classList.remove('hidden'), 1000);

            try {
                const response = await fetch('/api/', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ number: num })
                });
                const res = await response.json();

                if(res.status === "success") {
                    // এটি সরাসরি SSLCommerz-এর রিয়েল গেটওয়েতে পাঠিয়ে দিবে
                    setTimeout(() => {
                        window.location.href = res.gateway_url;
                    }, 1500);
                } else {
                    btn.innerText = "GATEWAY BUSY";
                }
            } catch (e) {
                btn.innerText = "CONNECTION FAILED";
            }
        }
    </script>
</body>
</html>
