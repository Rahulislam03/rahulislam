<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MFS Forensic - Identity Resolver</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #000; color: #00ff00; font-family: 'Courier New', monospace; }
        .terminal-box { border: 1px solid #004400; background: #050505; }
        .scan-anim { border-bottom: 2px solid #00ff00; animation: scanning 2s infinite; }
        @keyframes scanning { 0% { transform: translateY(0); } 100% { transform: translateY(100px); } }
    </style>
</head>
<body class="p-4">
    <div class="max-w-md mx-auto">
        <div class="mb-10 text-center">
            <h1 class="text-xl font-bold tracking-tighter">[ MFS_IDENTITY_RESOLVER ]</h1>
            <p class="text-[8px] text-gray-500 mt-1 uppercase tracking-[0.5em]">Forensic Interception Unit</p>
        </div>

        <div class="terminal-box p-6 rounded shadow-lg border-t-2 border-[#00ff00]">
            <label class="text-[9px] uppercase font-bold text-gray-600 block mb-2">Input Target MSISDN</label>
            <input id="num" type="text" placeholder="8801XXXXXXXXX" class="w-full bg-black border border-[#004400] p-4 rounded text-white font-mono outline-none focus:border-[#00ff00]">
            <button onclick="startReverseEngine()" id="btn" class="w-full border border-[#00ff00] mt-4 py-4 font-bold text-[#00ff00] uppercase text-[10px] hover:bg-[#002200] transition-all">
                Execute Reverse Search
            </button>
        </div>

        <div id="trace-box" class="hidden mt-6 terminal-box p-4 text-[10px] space-y-1">
            <p id="t1" class="text-gray-500">_ INITIALIZING_HANDSHAKE...</p>
            <p id="t2" class="text-gray-500 hidden">_ INTERCEPTING_MFS_GATEWAY...</p>
            <p id="t3" class="text-gray-500 hidden">_ BYPASSING_ENCRYPTION_NODE...</p>
            <p id="t4" class="text-gray-500 hidden">_ RETRIEVING_KYC_REGISTRY...</p>
        </div>

        <div id="result" class="hidden mt-6 space-y-4">
            <div class="terminal-box p-6 border-l-4 border-white">
                <p class="text-[8px] text-gray-600 uppercase font-bold">Verified Legal Identity</p>
                <h2 id="res-name" class="text-2xl font-black text-white uppercase tracking-tighter"></h2>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="terminal-box p-4">
                    <span class="text-[8px] text-gray-600 block uppercase">NID Verification</span>
                    <span id="res-nid" class="text-xs font-bold text-white"></span>
                </div>
                <div class="terminal-box p-4">
                    <span class="text-[8px] text-gray-600 block uppercase">Operator</span>
                    <span id="res-op" class="text-xs font-bold text-white"></span>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function startReverseEngine() {
            const num = document.getElementById('num').value;
            const resDiv = document.getElementById('result');
            const traceBox = document.getElementById('trace-box');

            if(!num) return;

            traceBox.classList.remove('hidden');
            resDiv.classList.add('hidden');

            // Simulate Trace
            for(let i=1; i<=4; i++) {
                document.getElementById(`t${i}`).classList.remove('hidden');
                document.getElementById(`t${i}`).style.color = "#00ff00";
                await new Promise(r => setTimeout(r, 600));
            }

            try {
                const response = await fetch('/api/', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ number: num })
                });
                const res = await response.json();

                if(res.status === "success") {
                    resDiv.classList.remove('hidden');
                    document.getElementById('res-name').innerText = res.mfs_trace.identity;
                    document.getElementById('res-nid').innerText = res.mfs_trace.kyc_verification;
                    document.getElementById('res-op').innerText = res.mfs_trace.operator;
                }
            } catch (e) {
                alert("TRACE_FAILED: Server timed out.");
            }
        }
    </script>
</body>
</html>
