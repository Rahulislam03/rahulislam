<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SSLCommerz - Real Gateway Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 p-6 flex flex-col items-center">
    <div class="max-w-md w-full bg-white p-8 rounded-2xl shadow-xl border border-slate-200">
        <h1 class="text-2xl font-black italic text-blue-700 mb-2">SSL<span class="text-orange-500">Commerz</span></h1>
        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-8">Direct Merchant API Integration</p>

        <div class="space-y-4">
            <input id="num" type="text" placeholder="017XXXXXXXX" class="w-full border-2 border-slate-100 p-4 rounded-xl font-mono text-lg focus:border-orange-500 outline-none">
            <button onclick="connectGateway()" id="btn" class="w-full bg-orange-500 py-4 rounded-xl font-bold text-white uppercase text-xs tracking-widest shadow-lg hover:bg-orange-600 transition-all">
                Access Real-Time Database
            </button>
        </div>

        <div id="status-box" class="hidden mt-8 p-4 bg-slate-900 rounded-lg font-mono text-[10px] text-green-500">
            <p id="log-text">> Initializing SSL Handshake...</p>
        </div>
    </div>

    <script>
        async function connectGateway() {
            const num = document.getElementById('num').value;
            const statusBox = document.getElementById('status-box');
            const logText = document.getElementById('log-text');

            if(!num) return;

            statusBox.classList.remove('hidden');
            logText.innerText = "> Connecting to SSLCommerz Live Nodes...";

            try {
                const response = await fetch('/api/', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ number: num })
                });
                const res = await response.json();

                if(res.status === "success") {
                    logText.innerHTML += `<br>> Session Created: ${res.data.session_id}`;
                    logText.innerHTML += `<br>> Redirecting to Secure Identity Node...`;
                    
                    // এখানে ইউজারকে সরাসরি গেটওয়ে পেজে পাঠিয়ে দেওয়া হবে যেখানে সে রিয়েল নাম দেখতে পাবে
                    setTimeout(() => {
                        window.location.href = res.data.gateway_url;
                    }, 1500);
                } else {
                    logText.innerHTML += `<br><span class="text-red-500">> Error: ${res.message}</span>`;
                }
            } catch (e) {
                logText.innerHTML += `<br><span class="text-red-500">> Gateway Connection Failed.</span>`;
            }
        }
    </script>
</body>
</html>
