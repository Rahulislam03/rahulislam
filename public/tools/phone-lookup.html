<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Intelligence - Deep Search</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(59, 130, 246, 0.2); }
        .spin { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-[#0f172a] text-white min-h-screen p-4 flex flex-col items-center font-sans">

    <div class="w-full max-w-md mt-10">
        <div class="text-center mb-8">
            <h1 class="text-4xl font-black text-blue-500 tracking-tighter">NEXUS OSINT</h1>
            <p class="text-gray-400 text-xs uppercase tracking-widest mt-2">Advanced Identity & Carrier Tracking</p>
        </div>

        <div class="glass p-6 rounded-[2rem] shadow-2xl mb-6">
            <input id="num" type="text" placeholder="+8801XXXXXXXXX" class="w-full bg-[#0f172a] border border-gray-700 p-5 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none text-center text-2xl font-mono mb-4 transition-all">
            
            <button onclick="startSearch()" id="search-btn" class="w-full bg-blue-600 hover:bg-blue-700 p-5 rounded-2xl font-bold transition-all flex items-center justify-center space-x-3 group">
                <i class="fas fa-satellite-dish group-hover:animate-pulse"></i>
                <span id="btn-text">DEEP SCAN NUMBER</span>
            </button>
        </div>

        <div id="result" class="hidden space-y-4 animate-fade-in">
            
            <div class="glass p-8 rounded-[2rem] text-center border-green-500/30">
                <p class="text-[10px] text-blue-400 font-bold uppercase mb-2">Registry Name</p>
                <h2 id="res-owner" class="text-2xl font-bold text-white mb-1">Searching...</h2>
                <p id="res-loc" class="text-gray-400 text-xs"></p>
                
                <div id="tc-helper" class="mt-5 p-4 bg-blue-500/10 rounded-2xl border border-blue-500/20 hidden">
                    <p class="text-[10px] mb-3">নাম সরাসরি না আসলে নিচের লিঙ্কে চেক করুন:</p>
                    <a id="tc-link" target="_blank" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-xl text-xs font-bold transition">
                        Check via Truecaller Registry
                    </a>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="glass p-5 rounded-3xl">
                    <span class="text-[10px] text-gray-500 uppercase block mb-1">Operator</span>
                    <span id="res-car" class="font-bold text-blue-400 text-sm"></span>
                </div>
                <div class="glass p-5 rounded-3xl">
                    <span class="text-[10px] text-gray-500 uppercase block mb-1">Line Type</span>
                    <span id="res-type" class="font-bold text-purple-400 text-sm"></span>
                </div>
            </div>

            <div class="glass p-6 rounded-[2rem] space-y-4">
                <div class="flex justify-between border-b border-gray-800 pb-2 text-sm">
                    <span class="text-gray-500">Intl Format</span>
                    <span id="res-fmt" class="font-mono"></span>
                </div>
                <div class="flex justify-between border-b border-gray-800 pb-2 text-sm">
                    <span class="text-gray-500">Timezone</span>
                    <span id="res-tz" class="text-yellow-500"></span>
                </div>
                <div class="flex justify-between text-sm">
                    <span class="text-gray-500">Network Status</span>
                    <span id="res-val" class="text-green-500 font-bold"></span>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function startSearch() {
            const num = document.getElementById('num').value;
            const btn = document.getElementById('search-btn');
            const btnText = document.getElementById('btn-text');
            const resDiv = document.getElementById('result');

            if(!num) return alert("Number please!");

            btnText.innerText = "Scanning Registry...";
            btn.disabled = true;

            try {
                const response = await fetch('/api/', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ number: num })
                });
                const res = await response.json();

                if(res.status === "success") {
                    resDiv.classList.remove('hidden');
                    document.getElementById('res-owner').innerText = res.data.owner;
                    document.getElementById('res-loc').innerText = res.data.location;
                    document.getElementById('res-car').innerText = res.data.carrier;
                    document.getElementById('res-type').innerText = res.data.type;
                    document.getElementById('res-fmt').innerText = res.data.intl;
                    document.getElementById('res-tz').innerText = res.data.tz;
                    document.getElementById('res-val').innerText = res.data.valid;
                    
                    // Truecaller Helper Logic
                    if(res.data.owner.includes("Hidden")) {
                        document.getElementById('tc-helper').classList.remove('hidden');
                        document.getElementById('tc-link').href = res.data.tc_url;
                    } else {
                        document.getElementById('tc-helper').classList.add('hidden');
                    }

                    window.scrollTo({ top: resDiv.offsetTop - 20, behavior: 'smooth' });
                }
            } catch (err) {
                alert("API Error!");
            } finally {
                btnText.innerText = "DEEP SCAN NUMBER";
                btn.disabled = false;
            }
        }
    </script>
</body>
    </html>
