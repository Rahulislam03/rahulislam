<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Advanced Lookup</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 20px; }
        .glow-btn { box-shadow: 0 0 15px rgba(59, 130, 246, 0.5); }
    </style>
</head>
<body class="bg-[#0f172a] text-white min-h-screen p-4 flex flex-col items-center">

    <div class="w-full max-w-lg mt-10">
        <h1 class="text-3xl font-black text-center text-blue-500 mb-2 italic">NEXUS INTELLIGENCE</h1>
        <p class="text-center text-gray-400 text-xs mb-8 uppercase tracking-widest">Global OSINT Database Access</p>

        <div class="card p-6 mb-6">
            <input id="num" type="text" placeholder="+8801XXXXXXXXX" class="w-full bg-[#0f172a] border border-gray-700 p-5 rounded-xl text-center text-2xl font-mono focus:ring-2 focus:ring-blue-500 outline-none mb-4">
            <button onclick="startDeepScan()" id="btn" class="w-full bg-blue-600 hover:bg-blue-700 p-4 rounded-xl font-bold flex items-center justify-center space-x-2 glow-btn transition-all">
                <i class="fas fa-microchip"></i>
                <span id="btn-text">DEEP SCAN NUMBER</span>
            </button>
        </div>

        <div id="result" class="hidden animate-fade-in space-y-4">
            
            <div class="card p-8 text-center border-blue-500/30">
                <p class="text-[10px] text-blue-400 font-bold uppercase mb-2">Possible Identity</p>
                <h2 id="res-name" class="text-3xl font-extrabold text-white"></h2>
                <div class="mt-4 inline-flex items-center px-3 py-1 bg-green-500/10 rounded-full">
                    <span class="w-2 h-2 bg-green-500 rounded-full animate-ping mr-2"></span>
                    <span id="res-status" class="text-xs text-green-500 font-bold"></span>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="card p-4">
                    <span class="text-xs text-gray-500 block">CARRIER</span>
                    <span id="res-car" class="font-bold text-blue-400"></span>
                </div>
                <div class="card p-4">
                    <span class="text-xs text-gray-500 block">LOCATION</span>
                    <span id="res-loc" class="font-bold text-gray-200"></span>
                </div>
            </div>

            <div class="card p-6">
                <h3 class="text-xs font-bold text-gray-400 mb-4 uppercase">Confirm Identity via Social OSINT</h3>
                <div class="grid grid-cols-3 gap-3">
                    <a id="link-fb" target="_blank" class="bg-blue-600 p-3 rounded-lg text-center hover:scale-105 transition"><i class="fab fa-facebook-f"></i></a>
                    <a id="link-tc" target="_blank" class="bg-blue-400 p-3 rounded-lg text-center hover:scale-105 transition"><i class="fas fa-phone-alt"></i></a>
                    <a id="link-wa" target="_blank" class="bg-green-600 p-3 rounded-lg text-center hover:scale-105 transition"><i class="fab fa-whatsapp"></i></a>
                </div>
                <p class="text-[9px] text-gray-500 mt-4 text-center">Note: Social verification increases accuracy by 98%.</p>
            </div>
        </div>
    </div>

    <script>
        async function startDeepScan() {
            const num = document.getElementById('num').value;
            const btnText = document.getElementById('btn-text');
            if(!num) return alert("Enter Number!");

            btnText.innerText = "Scanning Databases...";
            
            try {
                const response = await fetch('/api/', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ number: num })
                });
                const res = await response.json();
                
                if(res.status === "success") {
                    document.getElementById('result').classList.remove('hidden');
                    document.getElementById('res-name').innerText = res.data.name;
                    document.getElementById('res-status').innerText = res.data.valid + " Number";
                    document.getElementById('res-car').innerText = res.data.carrier;
                    document.getElementById('res-loc').innerText = res.data.location;
                    
                    // Social Links
                    document.getElementById('link-fb').href = res.data.deep_links.facebook;
                    document.getElementById('link-tc').href = res.data.deep_links.truecaller;
                    document.getElementById('link-wa').href = res.data.deep_links.whatsapp;
                    
                    window.scrollTo({ top: document.getElementById('result').offsetTop, behavior: 'smooth' });
                }
            } catch (err) { alert("Error!"); }
            finally { btnText.innerText = "DEEP SCAN NUMBER"; }
        }
    </script>
</body>
    </html>
