<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Intelligence System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #000; font-family: 'Courier New', monospace; }
        .nexus-card { background: #0a0a0a; border: 1px solid #1a1a1a; border-radius: 5px; }
        .scan-line { width: 100%; height: 2px; background: #00ff00; position: absolute; top: 0; animation: scan 2s linear infinite; opacity: 0.3; }
        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }
        .text-neon { color: #00ff00; text-shadow: 0 0 5px #00ff00; }
    </style>
</head>
<body class="p-6 text-gray-300">

    <div class="max-w-md mx-auto">
        <header class="text-center mb-10">
            <h1 class="text-2xl font-bold text-neon mb-1">NEXUS MAIN-FRAME</h1>
            <p class="text-[10px] text-gray-600 uppercase tracking-[5px]">Restricted Database Access</p>
        </header>

        <div class="nexus-card p-6 relative overflow-hidden">
            <div id="scan-bar" class="scan-line hidden"></div>
            <input id="num" type="text" placeholder="ENTER TARGET NUMBER" class="w-full bg-black border border-gray-800 p-4 rounded text-center text-neon focus:border-green-500 outline-none mb-4">
            <button onclick="runAnalysis()" id="btn" class="w-full border border-green-900 bg-green-900/10 p-4 text-green-500 font-bold hover:bg-green-900/30 transition-all uppercase text-xs tracking-widest">
                Start Deep Trace
            </button>
        </div>

        <div id="result" class="hidden mt-8 space-y-4 animate-fade-in">
            <div class="nexus-card p-6 border-l-4 border-green-500">
                <p class="text-[10px] text-gray-500 uppercase mb-2">Subject Identity</p>
                <h2 id="res-name" class="text-xl font-bold text-white tracking-widest"></h2>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="nexus-card p-4">
                    <span class="text-[9px] text-gray-600 block uppercase">Network</span>
                    <span id="res-car" class="text-sm font-bold text-green-400"></span>
                </div>
                <div class="nexus-card p-4">
                    <span class="text-[9px] text-gray-600 block uppercase">Status</span>
                    <span id="res-val" class="text-sm font-bold text-green-400"></span>
                </div>
            </div>

            <div class="nexus-card p-4 space-y-2">
                <div class="flex justify-between text-[11px]">
                    <span class="text-gray-600">Geo-Location:</span>
                    <span id="res-loc" class="text-white"></span>
                </div>
                <div class="flex justify-between text-[11px]">
                    <span class="text-gray-600">Node Rank:</span>
                    <span id="res-rank" class="text-white"></span>
                </div>
            </div>
            
            <p class="text-[8px] text-gray-700 text-center uppercase tracking-widest mt-4">All data retrieved from Nexus encrypted nodes.</p>
        </div>
    </div>

    <script>
        async function runAnalysis() {
            const num = document.getElementById('num').value;
            const btn = document.getElementById('btn');
            const scanBar = document.getElementById('scan-bar');
            const resDiv = document.getElementById('result');

            if(!num) return;

            btn.innerText = "TRACING...";
            scanBar.classList.remove('hidden');
            resDiv.classList.add('hidden');

            try {
                const response = await fetch('/api/', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ number: num })
                });
                const res = await response.json();

                if(res.status === "success") {
                    resDiv.classList.remove('hidden');
                    document.getElementById('res-name').innerText = res.data.owner_id;
                    document.getElementById('res-car').innerText = res.data.operator;
                    document.getElementById('res-val').innerText = res.data.status;
                    document.getElementById('res-loc').innerText = res.data.zone;
                    document.getElementById('res-rank').innerText = res.data.security_rank;
                }
            } catch (err) {
                alert("DATABASE TIMEOUT");
            } finally {
                btn.innerText = "Start Deep Trace";
                scanBar.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
